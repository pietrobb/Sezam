# INV-10 / review 8bc70f7 M9: every dependency manifest in the tree is watched
# (tests/test_inv10_public_repo.py fails on a manifest without an entry).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/core"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/core/ffi"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/core/py"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/core/wasm"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pub"
    directory: "/mobile"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
