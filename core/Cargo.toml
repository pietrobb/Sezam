[package]
name = "sezam-sync-core"
version = "0.3.0"
edition = "2021"
description = "The sync decisions of Sezam's desktop, web and phone clients as one pure state machine (docs/SYNC_SINGLE_SOURCE.md point 4b)"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
